# nginx SOLO para desarrollo local con Docker.
# En la VPS, Caddy recibe /api/* y lo manda directo al backend, asi que nginx
# nunca ve /api. Aqui no hay Caddy, asi que nginx hace de proxy.
#
# Se monta sobre /etc/nginx/conf.d/default.conf con docker-compose.local.yml.
# NO se usa en produccion; la imagen de prod lleva nginx.conf.

server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Las subidas de imagen son multipart: nginx por defecto corta en 1 MB.
	# El servidor acepta 5 MB y el navegador redimensiona a ~200 KB, pero se
	# deja holgura para no chocar con el 413.
	client_max_body_size 6m;

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/plain text/css application/javascript application/json
			   image/svg+xml application/manifest+json;

	# Angular habla con el backend por el nombre del servicio en la red.
	location /api/ {
		proxy_pass http://backend:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}

	location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
		expires 30d;
		add_header Cache-Control "public, immutable";
		access_log off;
	}

	location = /index.html {
		add_header Cache-Control "no-cache, no-store, must-revalidate";
	}

	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}
}
