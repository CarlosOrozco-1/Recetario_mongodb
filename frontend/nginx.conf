# Configuración de nginx para el frontend Angular (SPA).
# Montada en /etc/nginx/conf.d/default.conf dentro de la imagen de producción.

server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Compresión: el bundle de Angular weighs ~1 MB sin comprimir
	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/plain text/css application/javascript application/json
			   image/svg+xml application/manifest+json;

	# Rutas de Angular (/recipe/123, /profile/ana, /login...).
	# Sin este try_files, recargar una ruta interna da 404 aunque la app funcione.
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Los archivos de Angular llevan hash en el nombre (main-A1B2C3.js),
	# así que se pueden cachear para siempre.
	location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
		expires 30d;
		add_header Cache-Control "public, immutable";
		access_log off;
	}

	# index.html nunca se cachea: es quien apunta a los bundles con hash.
	location = /index.html {
		add_header Cache-Control "no-cache, no-store, must-revalidate";
	}

	# Health check para verificar el contenedor sin pasar por la app
	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}
}
