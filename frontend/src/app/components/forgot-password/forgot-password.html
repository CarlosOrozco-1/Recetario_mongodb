<div class="login-wrapper">
  <section class="login-hero" aria-label="Presentación del recetario">
    <div class="hero-content">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21a9 9 0 0 0 9-9H3a9 9 0 0 0 9 9Z"></path>
          <path d="M12 12V3"></path>
          <path d="M8 12V7"></path>
          <path d="M16 12V7"></path>
        </svg>
      </div>
      <h1>Sazón</h1>
      <p class="hero-tagline">Recupera el acceso a tu cuenta</p>
    </div>
  </section>

  <section class="login-panel">
    <div class="login-card">
      <div class="brand-header">
        <h2>Recuperar contraseña</h2>
        <p>Sigue los 3 pasos para restablecer tu contraseña</p>
      </div>

      <!-- Stepper -->
      <div class="stepper">
        <div class="step" [class.active]="step() >= 1" [class.done]="step() > 1">
          <span class="step-number">1</span>
          <span class="step-label">Correo</span>
        </div>
        <div class="step-line" [class.done]="step() > 1"></div>
        <div class="step" [class.active]="step() >= 2" [class.done]="step() > 2">
          <span class="step-number">2</span>
          <span class="step-label">Código</span>
        </div>
        <div class="step-line" [class.done]="step() > 2"></div>
        <div class="step" [class.active]="step() >= 3">
          <span class="step-number">3</span>
          <span class="step-label">Nueva clave</span>
        </div>
      </div>

      <div *ngIf="error" class="error-alert animate-slide-up">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        {{ error }}
      </div>

      <div *ngIf="success" class="success-alert animate-slide-up">
        {{ success }}
      </div>

      <!-- Paso 1 -->
      <form *ngIf="step() === 1" (ngSubmit)="requestReset()">
        <div class="input-group">
          <label for="email">Correo electrónico</label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2" ry="2"></rect><polyline points="3 7 12 13 21 7"></polyline></svg>
            <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="ejemplo@correo.com" required />
          </div>
        </div>
        <button type="submit" class="btn-primary btn-submit" [disabled]="loading()">
          <span *ngIf="loading()" class="spinner"></span>
          {{ loading() ? 'Enviando...' : 'Enviar código' }}
        </button>
      </form>

      <!-- Paso 2 -->
      <form *ngIf="step() === 2" (ngSubmit)="verifyCode()">
        <div class="input-group">
          <label for="code">Código de verificación</label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input id="code" type="text" [(ngModel)]="code" name="code" placeholder="123456" required maxlength="6" />
          </div>
        </div>
        <div class="form-actions-row">
          <button type="button" class="btn-secondary" (click)="goBack()">Atrás</button>
          <button type="submit" class="btn-primary" [disabled]="loading()">
            <span *ngIf="loading()" class="spinner"></span>
            {{ loading() ? 'Verificando...' : 'Verificar' }}
          </button>
        </div>
      </form>

      <!-- Paso 3 -->
      <form *ngIf="step() === 3" (ngSubmit)="resetPassword()">
        <div class="input-group">
          <label for="password">Nueva contraseña</label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="Mínimo 8 caracteres" required minlength="8" />
          </div>
        </div>
        <div class="input-group">
          <label for="confirmPassword">Confirmar contraseña</label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Repite la contraseña" required />
          </div>
        </div>
        <div class="form-actions-row">
          <button type="button" class="btn-secondary" (click)="goBack()">Atrás</button>
          <button type="submit" class="btn-primary" [disabled]="loading()">
            <span *ngIf="loading()" class="spinner"></span>
            {{ loading() ? 'Guardando...' : 'Restablecer' }}
          </button>
        </div>
      </form>

      <div class="auth-footer">
        <p><a routerLink="/login">Volver al inicio de sesión</a></p>
      </div>
    </div>
  </section>
</div>
